name: Scheduled Docker Compose Job

on:
  schedule:
    - cron: '00 21 * * *' 
  workflow_dispatch:    

jobs:
  compose-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> .env
          echo "AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }}" >> .env

      - name: Run Docker Compose
        run: |
          docker compose up -d
          sleep 30  # wait for containers to boot up
          docker compose logs
          docker compose down
