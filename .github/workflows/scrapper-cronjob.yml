name: Scheduled Docker Compose Job

on:
  schedule:
    - cron: '06 19 * * *' 
  workflow_dispatch:    

jobs:
  compose-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Docker Compose
        run: |
          docker compose up -d
          sleep 30  # wait for containers to boot up
          docker compose logs
          docker compose down
