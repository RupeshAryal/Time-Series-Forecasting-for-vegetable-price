name: Scheduled Docker Compose Job

on:
  schedule:
    - cron: '12 8 * * *' 
  workflow_dispatch:    

jobs:
  compose-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install docker compose
        run:  apt-get install docker-compose

      - name: Run Docker Compose
        run: |
          docker-compose up -d
          sleep 30  # wait for containers to boot up
          docker-compose logs
          docker-compose down
